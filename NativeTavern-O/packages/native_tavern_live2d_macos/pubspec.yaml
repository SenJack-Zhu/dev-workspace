name: native_tavern_live2d_macos
description: NativeTavern macOS bridge for Live2D Cubism SDK for Native.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: NativeTavernLive2DMacosPlugin
