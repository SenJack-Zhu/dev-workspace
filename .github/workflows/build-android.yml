name: Build Flutter Android APK (NativeTavern-O)

on:
  push:
    branches: [ main ]
    # 只在 NativeTavern-O 子目录有变动时触发构建（总仓库放其他项目不会触发）
    paths:
      - 'NativeTavern-O/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'NativeTavern-O/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      g_sub_ver:
        description: 'G-series build suffix (e.g. 1 → 0.1.15-G1)'
        required: false
        default: '1'
        type: string
      build_mode:
        description: 'Build mode'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug

# GitHub Actions ubuntu-latest 工作目录是 repo 根。
# 本工作流所有步骤都在二级目录 NativeTavern-O 下执行。
env:
  PROJECT_DIR: NativeTavern-O
  # 原作者 pubspec.yaml: flutter: '>=3.44.9'
  FLUTTER_CHANNEL: 'stable'
  ANDROID_ORG: 'com.miaomiaoxworld'
  ANDROID_PROJECT_NAME: 'native_tavern'

jobs:
  # ================================================================
  # 步骤 1: 变化检测 - 决定 Rust FFI / pubspec 是否需要特殊处理
  # ================================================================
  check_changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      pubspec: ${{ steps.filter.outputs.pubspec }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v2
        id: filter
        with:
          # 所有过滤路径都加上二级目录前缀
          filters: |
            rust:
              - 'NativeTavern-O/rust/**'
              - 'NativeTavern-O/Cargo.toml'
              - 'NativeTavern-O/Cargo.lock'
            pubspec:
              - 'NativeTavern-O/pubspec.yaml'
              - 'NativeTavern-O/pubspec.lock'

  # ================================================================
  # 步骤 2: 主构建任务（ubuntu-latest，不用 Mac）
  # ================================================================
  build:
    needs: check_changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    timeout-minutes: 75
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # JDK 17 是 Android Gradle AGP 8.x 的硬要求
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          architecture: 'x64'

      - name: Setup Flutter (stable channel, cached)
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Accept Android SDK licenses
        run: |
          yes | flutter doctor --android-licenses > /dev/null 2>&1 || true
          flutter doctor -v || true

      # ------- Rust FFI codegen（v0.1.15+39 没有 rust/，全部 if: false 跳过） -------
      - name: Install flutter_rust_bridge_codegen (only if Rust changed)
        if: needs.check_changes.outputs.rust == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo install flutter_rust_bridge_codegen || true

      - name: Setup Rust toolchain (only if Rust changed)
        if: needs.check_changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Run flutter_rust_bridge codegen (only if Rust changed)
        if: needs.check_changes.outputs.rust == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter_rust_bridge_codegen generate || true

      # ------- 生成 Android 平台地基（同 build_android.sh 第 69 行） -------
      - name: Generate Android platform scaffold + protect committed Flutter state
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          # 防止 flutter create 回写 .metadata / pubspec.lock，还原已提交版本
          STATE_DIR="$(mktemp -d)"
          for sf in .metadata pubspec.lock; do
            [ -f "$sf" ] && cp "$sf" "$STATE_DIR/$sf"
          done

          if [ ! -d "android" ]; then
            echo "--- no android/ dir, generating via flutter create ---"
            flutter create \
              --platforms=android \
              --org "$ANDROID_ORG" \
              --project-name "$ANDROID_PROJECT_NAME" \
              .
            echo "--- done ---"
          else
            echo "--- android/ already exists ---"
          fi

          for sf in .metadata pubspec.lock; do
            if [ -f "$STATE_DIR/$sf" ]; then
              cp "$STATE_DIR/$sf" "./$sf"
            else
              rm -f "./$sf"
            fi
          done
          rm -rf "$STATE_DIR"

          ls -la android/ 2>/dev/null | head -8

      # ------- 拉依赖 -------
      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get
          echo "--- package_config: $(ls .dart_tool/package_config.json 2>/dev/null && echo OK || echo MISSING) ---"

      # ------- 计算版本 + 构建 APK -------
      - name: 🩹 Patch flutter_inappwebview_android ProGuard (fix deprecated proguard-android.txt)
        working-directory: \${{ env.PROJECT_DIR }}
        run: |
          echo "Patching flutter_inappwebview_android build.gradle for ProGuard compatibility..."
          TARGET_DIR="$PUB_CACHE/hosted/pub.dev"
          FILE=$(find "$TARGET_DIR" -maxdepth 3 -path "*/flutter_inappwebview_android-*/android/build.gradle" 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then
            echo "WARNING: flutter_inappwebview_android build.gradle NOT FOUND in PUB_CACHE, skipping patch"
            ls "$TARGET_DIR" 2>/dev/null | grep -i inapp || true
          else
            echo "Found: $FILE"
            echo "Before (line 40-48):"
            sed -n '40,48p' "$FILE" || true
            sed -i "s|getDefaultProguardFile('proguard-android.txt')|getDefaultProguardFile('proguard-android-optimize.txt')|g" "$FILE"
            echo "After:"
            sed -n '40,48p' "$FILE" || true
            if grep -q "proguard-android.txt" "$FILE"; then
              echo "ERROR: replace failed, old string still present!"
              exit 1
            else
              echo "Patch applied successfully"
            fi
          fi

      - name: Build APK
        id: get_ver
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          # pubspec.yaml: version: 0.1.15+39  -> 主体 0.1.15, build_no 39
          RAW_VER=$(awk '/^version:/ {print $2; exit}' pubspec.yaml | cut -d '+' -f 1 | tr -d '\r\n')
          BUILD_NO=$(awk '/^version:/ {split($2,a,"+"); print a[2]; exit}' pubspec.yaml | tr -d '\r\n')
          echo "base version: $RAW_VER; build number: ${BUILD_NO:-n/a}"

          # G-series suffix: dispatch 输入优先，否则默认 1
          G_SUB_VER="${{ github.event.inputs.g_sub_ver }}"
          if [ -z "$G_SUB_VER" ]; then
            G_SUB_VER=1
          fi
          APP_VER="${RAW_VER}-G${G_SUB_VER}"
          echo "APP_VER=$APP_VER"
          echo "version=$APP_VER" >> $GITHUB_OUTPUT
          echo "build_no=${BUILD_NO:-0}" >> $GITHUB_OUTPUT

          # Mode: release 默认；workflow_dispatch 时可选 debug
          MODE="${{ github.event.inputs.build_mode }}"
          [ -z "$MODE" ] && MODE=release
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "build mode: $MODE"

          echo "--- flutter build apk --$MODE, VERSION=$APP_VER ---"
          # 注意：没有上传签名密钥的情况下，release/debug APK 都会用 Android debug keystore 来签
          #       → 可以直接安装到手机，但不能用于 Google Play 上传
          flutter build apk \
            --$MODE \
            --no-pub \
            --dart-define=VERSION="$APP_VER" \
            2>&1 | tail -80

          echo "--- APK outputs ---"
          ls -lh build/app/outputs/flutter-apk/ 2>/dev/null || echo "NO APK OUTPUT DIR!"

      # ------- 上传 APK -------
      - name: Upload APK artifact (downloadable from Actions UI)
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ steps.get_ver.outputs.mode }}-${{ steps.get_ver.outputs.version }}-build${{ steps.get_ver.outputs.build_no }}
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-${{ steps.get_ver.outputs.mode }}.apk
          if-no-files-found: error
          retention-days: 60

      # ------- release 模式下顺便打包 AAB -------
      - name: (Release only) Build App Bundle (AAB)
        id: aab_build
        if: steps.get_ver.outputs.mode == 'release'
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          flutter build appbundle --release --no-pub 2>&1 | tail -30
          ls -lh build/app/outputs/bundle/release/ 2>/dev/null || true
          echo "built=yes" >> $GITHUB_OUTPUT

      - name: Upload AAB artifact
        if: steps.get_ver.outputs.mode == 'release' && steps.aab_build.outputs.built == 'yes'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-release-aab-${{ steps.get_ver.outputs.version }}-build${{ steps.get_ver.outputs.build_no }}
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
          retention-days: 30
