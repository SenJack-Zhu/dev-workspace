name: Build MoRead Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'MoRead-module/**'
      - '.github/workflows/build-morange.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'MoRead-module/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - performance

permissions:
  contents: read

concurrency:
  group: moreange-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: MoRead-module

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          architecture: 'x64'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties (CI safe)
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "CI=true" >> local.properties

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build debug APK
        if: github.event.inputs.build_type != 'performance'
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Build performance APK (R8 optimized)
        if: github.event.inputs.build_type == 'performance' || github.event_name == 'push'
        run: ./gradlew :app:assemblePerformance --console=plain

      - name: Prepare artifacts
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          cd $PROJECT_DIR
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/mozhi-${VERSION_NAME}-vc${VERSION_CODE}-debug.apk" 2>/dev/null || true
          cp app/build/outputs/apk/performance/app-performance.apk "dist/mozhi-${VERSION_NAME}-vc${VERSION_CODE}-performance.apk" 2>/dev/null || true
          ls -la dist/

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mozhi-debug-apk
          path: ${{ env.PROJECT_DIR }}/dist/*debug.apk
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload performance APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mozhi-performance-apk
          path: ${{ env.PROJECT_DIR }}/dist/*performance.apk
          retention-days: 30
          if-no-files-found: ignore
